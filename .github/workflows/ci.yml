name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Existing code has lint errors (react-hooks/set-state-in-effect). Remove continue-on-error once fixed.
      - run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm test
